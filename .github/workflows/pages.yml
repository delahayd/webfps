name: Deploy Outbreak to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'outbreak/dist/**'
      - 'outbreak/tests/campaign.cjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify campaign
        run: node outbreak/tests/campaign.cjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Outbreak
        uses: actions/upload-pages-artifact@v4
        with:
          path: outbreak/dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
